<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- System-bus security policy for the openssl_encrypt D-Bus service.
       Install to /usr/share/dbus-1/system.d/ (or /etc/dbus-1/system.d/).

       Authorization model (H7): this bus policy only permits SENDING to
       the service; it is NOT the authorization layer. The service itself
       authorizes every method call through polkit
       (ch.rmrf.openssl_encrypt.policy: admin authentication required) and
       fails closed when polkit is unavailable. This file is only needed
       for the system-bus deployment (openssl-encrypt-dbus-system.service,
       started with the system flag); the per-user session service does
       not use it. -->

  <!-- Only root can own the service -->
  <policy user="root">
    <allow own="ch.rmrf.openssl_encrypt"/>
  </policy>

  <!-- Anyone may SEND to the service; polkit decides per method whether
       the caller is authorized (the caller's polkit agent prompts for
       admin credentials), so unprivileged callers get a clean denial
       instead of a bus-level error -->
  <policy context="default">
    <allow send_destination="ch.rmrf.openssl_encrypt"
           send_interface="ch.rmrf.openssl_encrypt.Crypto"/>
    <allow send_destination="ch.rmrf.openssl_encrypt"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="ch.rmrf.openssl_encrypt"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="ch.rmrf.openssl_encrypt"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>

  <!-- Allow the service to send signals -->
  <policy user="root">
    <allow send_interface="ch.rmrf.openssl_encrypt.Crypto"
           send_type="signal"/>
  </policy>

</busconfig>
