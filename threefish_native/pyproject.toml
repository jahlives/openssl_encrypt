[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "openssl-encrypt-threefish"
version = "1.0.0"
description = "Threefish-512 and Threefish-1024 AEAD ciphers for openssl-encrypt (256-bit and 512-bit PQ security)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
]
keywords = ["cryptography", "threefish", "post-quantum", "encryption", "aead"]

[project.urls]
Homepage = "https://github.com/tobiasfaust/openssl_encrypt"
Repository = "https://github.com/tobiasfaust/openssl_encrypt"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "threefish_native"
strip = true
