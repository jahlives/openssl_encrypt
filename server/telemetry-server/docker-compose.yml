version: '3.8'

services:
  # FastAPI application
  api:
    build: .
    container_name: telemetry-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://telemetry:telemetry_password@db:5432/telemetry
      - SECRET_KEY=${SECRET_KEY:-CHANGE_THIS_IN_PRODUCTION}
      - API_KEY_EXPIRY_DAYS=365
      - MAX_EVENTS_PER_REQUEST=1000
      - RATE_LIMIT_EVENTS_PER_DAY=10000
      - RAW_DATA_RETENTION_DAYS=90
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - telemetry-network

  # PostgreSQL database
  db:
    image: postgres:15-alpine
    container_name: telemetry-db
    environment:
      - POSTGRES_USER=telemetry
      - POSTGRES_PASSWORD=telemetry_password
      - POSTGRES_DB=telemetry
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - telemetry-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Background worker for data aggregation (optional, can be implemented later)
  # aggregator:
  #   build: .
  #   container_name: telemetry-aggregator
  #   command: python -m app.workers.aggregator
  #   environment:
  #     - DATABASE_URL=postgresql://telemetry:telemetry_password@db:5432/telemetry
  #   depends_on:
  #     - db
  #   restart: unless-stopped
  #   networks:
  #     - telemetry-network

volumes:
  db_data:
    driver: local

networks:
  telemetry-network:
    driver: bridge
