[pytest]
# Pytest configuration for OpenSSL Encrypt

# Test discovery patterns
# unittests.py predates the test_*.py naming convention and must be listed
# explicitly or its ~90 tests are silently never collected
python_files = test_*.py unittests.py
python_classes = Test*
python_functions = test_*

# Paths to search for tests
testpaths = tests

# Minimum version
minversion = 7.0

# Output options
addopts =
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for categorizing tests
markers =
    integration: Integration tests (client, server, e2e)
    security: Security-critical tests
    unit: Unit tests
    slow: Slow-running tests
    order: Test execution order (from pytest-order plugin)
    live: Tests requiring a live keyserver (use --live-server=URL)

# Coverage options
[coverage:run]
source = openssl_encrypt
omit =
    */tests/*
    */test_*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
