# Note: Base image is built manually using docker/build-base-image.sh
# This avoids complex CI Docker builds and allows local debugging

default:
  image: python:3.13-alpine
  cache:
    paths:
      - .pip-cache/
  before_script:
    - python3 --version
    - pip install --upgrade pip --break-system-packages
    - pip install build twine PyYAML --break-system-packages

stages:
  - sync
  - security
  - test
  - build
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  # Use manually built base image (built with docker/build-base-image.sh).
  # debian-slim (glibc) so pip installs manylinux wheels for C-extension KDFs
  # (RandomX/whirlpool) instead of musl source builds, matching dev/prod output.
  DOCKER_IMAGE: registry.rm-rf.ch/world/openssl_encrypt/python-liboqs:3.13-slim
  DOCS_ONLY: "false"
  # Immutable commit pins for the PQC upstreams (gitlab#252, F31/F33, CWE-494).
  # The liboqs clone below was floating on the upstream default branch; it now
  # pins the tag AND verifies the checkout against this commit, and liboqs-python
  # installs from its commit SHA. Bump both together.
  LIBOQS_VERSION: "0.12.0"
  LIBOQS_COMMIT: "f4b96220e4bd208895172acc4fedb5a191d9f5b1"
  LIBOQS_PYTHON_COMMIT: "7906e7879a099fa34217035957d977314f99757d"


sync-wiki:
  stage: sync
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    - git clone https://oauth2:${PROJECT_ACCESS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.wiki.git wiki
    - cp -r openssl_encrypt/docs/* wiki/
    # Fix the docsify Home link for the GitLab wiki (its home page is "home")
    - sed -i 's#](/)#](home)#g' wiki/_sidebar.md
    - cp README.md wiki/home.md
    - cp SECURITY.md wiki/security.md
    - cd wiki
    - git config --global user.email "pipeline@rm-rf.ch"
    - git config --global user.name "GitLab Pipeline"
    - git add .
    - git diff-index --quiet HEAD || git commit -m "Update wiki from docs folder"
    - git push
 #   - git remote add github git@github.com:jahlives/openssl_encrypt.wiki.git || true
 #   - git push github master:master --force
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "release"
    - if: $CI_COMMIT_BRANCH =~ /^releases\/.*/
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
      allow_failure: true

# Flatpak manifest pins must match requirements-prod.txt (fast, stdlib-only)
flatpak-pin-check:
  stage: security
  image: python:3.13-alpine
  script:
    # Run by path: importing the package would require the full dependency set
    - python openssl_encrypt/unittests/test_flatpak_pin_consistency.py -v
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH == "testing" && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH == "main" && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH == "release" && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH =~ /^releases\/.*/ && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH =~ /^feature\/.*/ && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_TAG && $DOCS_ONLY != "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $DOCS_ONLY != "true"

# Source-code integrity manifest verification (signature + protected-file hashes).
# Verify-only: holds NO private key (signing happens locally, decision D3).
source-integrity-verify:
  stage: security
  image: python:3.13-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gnupg && rm -rf /var/lib/apt/lists/*
  script:
    - echo "=== Verifying signed source-integrity manifest (signature + file hashes) ==="
    # Uses the lightweight integrity package directly (no full dependency tree, no
    # heavy CLI import). Checks the detached signature, the expected fingerprint
    # (keys/FINGERPRINT) and every protected-file hash; non-zero exit fails the job.
    - python -c "import sys; from openssl_encrypt.integrity.verify_cli import verify_integrity; sys.exit(verify_integrity(quiet=False))"
    - 'echo "NOTE: CI verifies against the in-repo public key, so it catches drift, stale/unsigned manifests and bad signatures. A full repo rewrite that also swaps the key would still pass here; only out-of-band fingerprint verification is complete (see docs/SOURCE_INTEGRITY.md)."'
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH == "testing" && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH == "main" && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH == "release" && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH =~ /^releases\/.*/ && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH =~ /^feature\/.*/ && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_TAG && $DOCS_ONLY != "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $DOCS_ONLY != "true"

# Dependency security scanning
dependency-scan:
  stage: security
  image: python:3.13
  script:
    - pip install pip-audit bandit
    # Use custom script that handles dependency scanning and GitLab report generation
    - python scripts/gitlab_dependency_scan.py
    # Display results for visibility in logs
    - echo "=== Production Dependencies Scan ==="
    - cat pip-audit-prod-results.json || echo "No production scan results available"
    - echo "=== Development Dependencies Scan ==="
    - cat pip-audit-dev-results.json || echo "No development scan results available"
    - echo "=== GitLab Dependency Scanning Report ==="
    - cat gl-dependency-scanning-report.json || echo "No report available"
  artifacts:
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
    paths:
      - gl-dependency-scanning-report.json
      - pip-audit-prod-results.json
      - pip-audit-dev-results.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH == "testing" && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH == "main" && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH == "release" && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH =~ /^releases\/.*/ && $DOCS_ONLY != "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $DOCS_ONLY != "true"

# Python code security scanning with Bandit
code-security-scan:
  stage: security
  image: python:3.13
  before_script:
    - pip install bandit[toml]
  script:
    # Run bandit with comprehensive security checks
    - bandit -r openssl_encrypt/ -c .bandit.yaml -f json -o gl-sast-report.json || true
    - bandit -r openssl_encrypt/ -c .bandit.yaml -f txt || true  # Display results in terminal
    - echo "=== Bandit Security Scan Results ==="
    - cat gl-sast-report.json | python -m json.tool | head -50 || echo "No issues found"
  artifacts:
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH == "testing" && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH == "main" && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH == "release" && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH =~ /^releases\/.*/ && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH == "nightly" && $DOCS_ONLY != "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $DOCS_ONLY != "true"

# Code quality analysis with Pylint
code-quality-scan:
  stage: security
  image: python:3.13
  before_script:
    - pip install pylint pylint-json2html
    - pip install -r requirements-prod.txt  # Install dependencies for import analysis
  script:
    # Run pylint with detailed analysis
    - pylint openssl_encrypt/ --output-format=json:pylint-report.json,text:pylint-report.txt,colorized || true
    - echo "=== Pylint Code Quality Results ==="
    - cat pylint-report.txt | head -50 || echo "No issues found"
    # Generate HTML report for better visualization
    - pylint-json2html -o pylint-report.html pylint-report.json || true
  artifacts:
    paths:
      - pylint-report.json
      - pylint-report.txt
      - pylint-report.html
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH == "testing" && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH == "main" && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH == "release" && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH =~ /^releases\/.*/ && $DOCS_ONLY != "true"
    - if: $CI_COMMIT_BRANCH == "nightly" && $DOCS_ONLY != "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $DOCS_ONLY != "true"

