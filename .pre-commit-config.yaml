# Pre-commit hooks for openssl_encrypt
# Install with: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key
        exclude: '^(tests/|tools/|openssl_encrypt/unittests/testfiles/)'
      - id: trailing-whitespace
        exclude: '^openssl_encrypt/unittests/testfiles/'
      - id: end-of-file-fixer
        exclude: '^openssl_encrypt/unittests/testfiles/'

  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=100]

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--line-length=100"]

  # Python linting with flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        additional_dependencies: [
          flake8-bugbear,      # Additional bug checks
          flake8-docstrings,   # Docstring checks
          flake8-import-order, # Import order checks
          flake8-bandit,       # Bandit integration
        ]

  # Security scanning with bandit
  - repo: https://github.com/pycqa/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [
          '-c', '.bandit.yaml',
          '-r', 'openssl_encrypt/',
          '--exclude', 'openssl_encrypt/unittests/',
          '--skip', 'B101,S105,S110'  # Skip: assert usage, hardcoded password false-positives, try-except-pass
        ]
        exclude: '^setup\.py$'

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies: [types-PyYAML, types-requests]
        exclude: '^(tests/|tools/|openssl_encrypt/unittests/)'

  # Security and vulnerability scanning (disabled - uncomment and configure API key to enable)
  # - repo: https://github.com/gitguardian/ggshield
  #   rev: v1.25.0
  #   hooks:
  #     - id: ggshield
  #       name: GitGuardian scan
  #       stages: [commit]
  #       args: ['secret', 'scan', 'pre-commit']

  # Python docstring formatting (disabled - too strict for this project)
  # Uncomment to enable docstring checking
  # - repo: https://github.com/pycqa/pydocstyle
  #   rev: 6.3.0
  #   hooks:
  #     - id: pydocstyle
  #       args: ['--convention=google', '--add-ignore=D212,D415,D400,D401']
  #       exclude: '^(tests/|tools/|openssl_encrypt/unittests/)'

  # YAML/JSON formatting and validation
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ['-d', 'relaxed']

  # Local hooks for project-specific checks
  - repo: local
    hooks:
      # Dependency vulnerability scanning
      - id: pip-audit
        name: pip-audit vulnerability scan
        entry: bash -c 'pip-audit --requirement requirements-prod.txt --format json --output pip-audit-local.json || (echo "Vulnerabilities found, check pip-audit-local.json" && exit 1)'
        language: system
        files: 'requirements.*\.txt$'
        pass_filenames: false

      # Plan file enforcement hook
      - id: check-plan-files
        name: Check plan files on restricted branches
        entry: .pre-commit-hooks/check-plan-files.py
        language: python
        types: [markdown]
        pass_filenames: true
        stages: [pre-commit]
        always_run: false
        files: '(?i).*(plan|implementation).*\.md$'

      # Regenerate and sign the source-integrity manifest when a protected
      # source file (or the allowlist) changes. Signs with the local project
      # key (keys/FINGERPRINT); the private key never leaves the dev machine.
      # See docs/SOURCE_INTEGRITY.md.
      - id: source-integrity-manifest
        name: Regenerate & sign source integrity manifest
        entry: python -m openssl_encrypt.integrity.update_manifest --sign --git-add
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: '^(openssl_encrypt/integrity/protected_files\.txt|openssl_encrypt/modules/.*\.py|openssl_encrypt/(__init__|__main__|cli|crypt|crypt_gui|versions|post_install)\.py|requirements(-(prod|dev|hsm))?\.(txt|in)|threefish_native/(Cargo\.toml|pyproject\.toml|src/.*\.rs))$'

# Configuration for specific checks
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

# Exclude specific patterns globally
exclude: |
  (?x)^(
    .*\.egg-info/.*|
    build/.*|
    dist/.*|
    \.git/.*|
    __pycache__/.*|
    \.pytest_cache/.*|
    \.venv/.*|
    .*\.pyc|
    .*\.pyo
  )$
