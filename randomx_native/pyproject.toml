[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "openssl-encrypt-randomx"
version = "1.0.0"
description = "RandomX KDF bindings for openssl-encrypt over the official tevador/RandomX library (vendored, pinned v1.1.10)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
]
keywords = ["randomx", "kdf", "cryptography", "openssl-encrypt"]

[project.urls]
Homepage = "https://github.com/jahlives/openssl_encrypt"
Repository = "https://github.com/jahlives/openssl_encrypt"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "randomx_native"
strip = true
# The vendored RandomX C library must ship in the sdist (no network at build).
include = [
    { path = "RandomX_src/**", format = "sdist" },
    { path = "RANDOMX_PIN", format = "sdist" },
    { path = "RANDOMX_LICENSE", format = "sdist" },
]
